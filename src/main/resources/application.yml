server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: flight-reservations
  lifecycle:
    # Con muchos usuarios concurrentes, un deploy no debería cortar pedidos en
    # curso: se deja de aceptar nuevos y se espera a que terminen los abiertos.
    timeout-per-shutdown-phase: 25s
  threads:
    virtual:
      # Threads virtuales (Java 21): el manejo de miles de pedidos concurrentes,
      # que son mayormente I/O, deja de estar limitado por el tamaño del pool.
      enabled: true

  datasource:
    # Coincide con compose.yaml: 'docker compose up -d' y listo.
    url: jdbc:postgresql://localhost:5432/reservations
    username: reservations
    password: reservations
    hikari:
      # Con hasta 100k registros por entidad y consultas por índice, el cuello
      # de botella no es la base sino las conexiones. Un pool chico y sano rinde
      # más que uno grande: cada conexión es un proceso del lado de PostgreSQL.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      pool-name: reservations-pool

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gobierna Flyway. 'validate' hace que la aplicación no
      # arranque si el mapeo y las tablas no coinciden, en lugar de fallar
      # recién en la primera consulta.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Las columnas son TIMESTAMP sin zona y guardan UTC. Esto fija la zona
          # con la que Hibernate convierte los Instant, para que el valor
          # escrito no dependa de la zona horaria del servidor.
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Si el esquema ya existe sin historial de Flyway, no lo adopta en silencio.
    baseline-on-migrate: false

reservations:
  airport-catalog:
    # El maestro de aeropuertos cambia muy poco y se consulta en cada operación.
    cache-ttl: 30m
    # Catálogo de ciudades: las ciudades del itinerario se validan contra este
    # servicio en cada POST y PUT. Coincide con el 'api-catalog' de
    # compose.yaml, así que 'docker compose up -d' y listo.
    #
    # Vaciar 'base-url' vuelve al stub en memoria: es lo que usan los tests,
    # para que el build no dependa de un servicio externo.
    base-url: http://localhost:6070/api/flights/catalog
    # La credencial nunca va en el archivo: viene del entorno. Hoy el catálogo
    # no pide autenticación, así que sin la variable no se manda el header.
    api-key: ${CATALOG_API_KEY:}
    api-key-header: X-API-Key
    #
    # Ese cliente no define timeouts ni reintenta (decisión explícita de esta
    # iteración). Los timeouts del cliente HTTP se configuran en un solo lugar,
    # 'spring.http.client', si más adelante se decide ponerlos.
  outbox:
    # Despacho de notificaciones hacia el sistema externo.
    dispatch-enabled: true
    dispatch-interval: 5s
    batch-size: 50
    max-attempts: 5

springdoc:
  # No se declara 'springdoc.open-api.servers': sin esa lista, el documento sale
  # con el origen del pedido que lo pidió, así que Swagger UI ejecuta siempre
  # contra el host desde el que se la está mirando (en local, localhost:8080).
  #
  # Con una lista fija encabezada por producción, el botón "Try it out" del
  # entorno local dispararía pedidos reales contra producción. Si un entorno
  # necesita publicar su lista de servidores, la declara acá sin tocar código:
  #
  #   open-api:
  #     servers:
  #       - url: https://api.edteam.example
  #         description: Producción
  #       - url: https://api.sandbox.edteam.example
  #         description: Sandbox para integraciones de partners
  api-docs:
    # El documento generado. Es la fuente de verdad del contrato: sale de los
    # controllers, los DTOs y sus anotaciones, así que no puede quedar viejo.
    path: /v3/api-docs
  # Claves ordenadas: dos generaciones del mismo código producen el mismo
  # archivo, así el documento se puede versionar y su diff se puede revisar.
  writer-with-order-by-keys: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    display-request-duration: true
    # Swagger UI queda expuesta porque todavía no hay autenticación. En cuanto
    # se sume seguridad hay que decidir si se publica y para quién: una UI que
    # permite ejecutar pedidos contra la API productiva no va abierta.
    enabled: true

management:
  endpoints:
    web:
      exposure:
        # Sondas de readiness/liveness para el orquestador. La seguridad de estos
        # endpoints queda fuera del alcance de este esqueleto.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.edteam.reservations: INFO
