server:
  port: 8080
  shutdown: graceful

spring:
  # El .env local, leído también por la APLICACIÓN.
  #
  # Sin esta línea, el .env sólo lo lee 'docker compose' —para sustituir los
  # ${VAR:-default} del compose.yaml— y 'mvn spring-boot:run' arranca sin
  # ninguna de sus variables: la contraseña de Redis y la del broker quedan
  # vacías y hay que exportarlas a mano en la shell antes de levantar. Es un
  # paso silencioso y fácil de olvidar, y el síntoma —un componente que no
  # conecta— no se parece a su causa.
  #
  # 'optional:' es lo que hace que la ausencia del archivo no sea un error: en
  # los tests y en cualquier entorno real no hay .env, y las variables las pone
  # el gestor de secretos. El formato KEY=VALUE del .env es el de un
  # .properties, así que el sufijo '[.properties]' le dice a Spring con qué
  # lector abrirlo.
  #
  # Precedencia: las variables de entorno de verdad ganan sobre el archivo, que
  # es el orden correcto —lo que el entorno exporta pisa al default local— y es
  # también lo que permite un 'MESSAGING_ENABLED=false ./mvnw spring-boot:run'
  # puntual sin editar el .env.
  config:
    import: optional:file:./.env[.properties]

  application:
    name: flight-reservations
  autoconfigure:
    exclude:
      # El starter de Redis viene con repositorios al estilo Spring Data, que
      # acá no se usan: el cache se maneja con StringRedisTemplate desde
      # 'infrastructure.cache'. Sin esta exclusión, el escaneo intenta asignar
      # los repositorios JPA a Redis y ensucia el arranque con una advertencia
      # por cada uno.
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  lifecycle:
    # Con muchos usuarios concurrentes, un deploy no debería cortar pedidos en
    # curso: se deja de aceptar nuevos y se espera a que terminen los abiertos.
    timeout-per-shutdown-phase: 25s
  threads:
    virtual:
      # Threads virtuales (Java 21): el manejo de miles de pedidos concurrentes,
      # que son mayormente I/O, deja de estar limitado por el tamaño del pool.
      enabled: true

  datasource:
    # Coincide con compose.yaml: 'docker compose up -d' y listo.
    #
    # Ninguna credencial queda escrita acá. Lo que se ve son los valores del
    # entorno local —el mismo docker compose de este repositorio— y en
    # cualquier otro entorno los pisan las variables. Antes el usuario y la
    # contraseña estaban literales, así que quedaban en el historial de git y
    # dentro de la imagen, y rotarlas obligaba a un commit.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservations}
    username: ${DB_USERNAME:reservations}
    password: ${DB_PASSWORD:reservations}
    hikari:
      # Con hasta 100k registros por entidad y consultas por índice, el cuello
      # de botella no es la base sino las conexiones. Un pool chico y sano rinde
      # más que uno grande: cada conexión es un proceso del lado de PostgreSQL.
      maximum-pool-size: 20
      minimum-idle: 5
      # 1 s y no 3 s. Con 20 conexiones y consultas por índice de pocos
      # milisegundos, esperar 3 s por una conexión significa que la cola tiene
      # cientos de pedidos adelante: a partir de cierto punto, rechazar es la
      # respuesta correcta y esperar más sólo agranda la cola. 1 s es el
      # tiempo en el que un pico legítimo se absorbe y una saturación real se
      # hace visible. El pedido rechazado sale como 503 + Retry-After: 1, no
      # como 500.
      connection-timeout: 1000
      pool-name: reservations-pool
      data-source-properties:
        # El corte duro, y va en el DRIVER a propósito.
        # 'jakarta.persistence.query.timeout' acota las consultas de JPA pero
        # NO cubre el flush ni el commit, que es justo donde pega una base
        # lenta: sin esto, connection-timeout acota la espera POR una conexión
        # y nada acota el uso de la que ya se tomó. Una base lenta retenía las
        # 20 conexiones sin corte y toda la API caía, incluidos los GET que no
        # tocaban la tabla lenta.
        #
        # 2 s: ninguna sentencia de este sistema tiene derecho a tardar más.
        # El peor caso documentado es la paginación, que son tres consultas
        # sobre índices.
        options: "-c statement_timeout=2000"

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gobierna Flyway. 'validate' hace que la aplicación no
      # arranque si el mapeo y las tablas no coinciden, en lugar de fallar
      # recién en la primera consulta.
      ddl-auto: validate
    properties:
      jakarta:
        persistence:
          # Complemento del statement_timeout, no reemplazo: éste aborta la
          # consulta desde el lado del cliente y produce un
          # QueryTimeoutException que el manejador traduce a 503; el del
          # driver es el que corta de verdad, del lado del servidor, y cubre
          # además el flush y el commit.
          query:
            timeout: 1000
      hibernate:
        jdbc:
          # Las columnas son TIMESTAMP sin zona y guardan UTC. Esto fija la zona
          # con la que Hibernate convierte los Instant, para que el valor
          # escrito no dependa de la zona horaria del servidor.
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  data:
    redis:
      # Conexión al cache distribuido. Sólo se usa si
      # 'reservations.cache.redis.enabled' está en true; si no, el cache es el
      # fallback en memoria y estos valores no se tocan.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # La credencial nunca va en el archivo: viene del entorno.
      password: ${REDIS_PASSWORD:}
      # Un cache lento es peor que un cache ausente: si Redis no contesta en
      # este tiempo, el almacén degrada al origen y el pedido sigue. Es el
      # único timeout del sistema, y está acá por la misma razón por la que los
      # del catálogo irían en 'spring.http.client': en un solo lugar.
      timeout: 200ms
      connect-timeout: 200ms

  rabbitmq:
    # Broker de la mensajería. Coincide con el 'rabbitmq' de compose.yaml, así
    # que 'docker compose up -d' y listo.
    #
    # Si no está levantado, la aplicación arranca igual: los eventos se
    # acumulan en la tabla outbox_message y el relay los publica cuando el
    # broker vuelve. Es el mismo criterio que con Redis y con el catálogo.
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:reservations}
    # La credencial nunca va en el archivo: viene del entorno.
    password: ${RABBIT_PASSWORD:}
    # Timeout de conexión de ESTE proveedor, no global: es la misma decisión
    # que con el catálogo de ciudades. Establecer la conexión es rápido o no va
    # a pasar.
    connection-timeout: 2s
    # No es opcional para este diseño: sin confirms, el relay marcaría el
    # mensaje como despachado apenas los bytes salen del socket —mucho antes de
    # que el broker los haya escrito— y la mentira se descubriría cuando el
    # mensaje ya no está en el outbox para reintentarlo.
    publisher-confirm-type: correlated
    # Un mensaje sin ninguna cola atada se descarta EN SILENCIO. Con esto el
    # broker lo devuelve y el binding faltante es un error visible en lugar de
    # una pérdida masiva de notificaciones que se ve igual que un sistema sano.
    publisher-returns: true
    template:
      mandatory: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Si el esquema ya existe sin historial de Flyway, no lo adopta en silencio.
    baseline-on-migrate: false

reservations:
  cache:
    redis:
      # Coincide con el 'redis' de compose.yaml, así que 'docker compose up -d'
      # y listo. Apagarlo (CACHE_REDIS_ENABLED=false) deja el cache en memoria
      # del proceso: la aplicación arranca igual, que es lo que permite correr
      # los tests y levantar la app sin Redis. Es el mismo criterio que con el
      # catálogo externo.
      #
      # Encendido es lo que convierte N caches fríos —uno por instancia— en uno
      # compartido que además sobrevive a los reinicios.
      enabled: ${CACHE_REDIS_ENABLED:true}
    # Cota del cache en memoria (el fallback). Contra Redis la cota la pone el
    # proveedor: en un free tier, 'allkeys-lru'.
    max-entries: 50000
    # Cota del L1 en memoria de las ciudades, que se escribe SIEMPRE —no sólo
    # cuando Redis se cae— para que esté caliente el día que haga falta.
    # Diez mil entradas cubren de sobra un catálogo de ciudades de unos pocos
    # miles, y a ~40 bytes por entrada son menos de un megabyte por instancia.
    # Sólo aplica al prefijo 'catalog:city:': las claves de versión NO caen a
    # memoria, porque se invalidan activamente y una copia por instancia daría
    # ETags distintos según quién atienda.
    city-fallback-max-entries: 10000
    circuit-breaker:
      # Por qué un circuito para un componente opcional: no es corrección, es
      # latencia. Con Redis caído, un POST hace hasta once lecturas y once
      # escrituras de ciudades más la versión, y cada una paga los 200 ms de
      # 'spring.data.redis.timeout'. Son segundos de espera pura por un
      # componente cuyo aporte es ahorrar tiempo. Con el circuito abierto
      # cuestan cero.
      enabled: ${CACHE_CIRCUIT_ENABLED:true}
      # Es la dependencia con más llamadas por pedido: 30 llamadas son ~2
      # pedidos, así que el mínimo se alcanza enseguida y la ventana de 100
      # sigue representando pocos segundos de tráfico.
      sliding-window-size: 100
      minimum-number-of-calls: 30
      failure-rate-threshold: 50
      # El timeout es 200 ms: una operación que tardó 150 ms ya está en la
      # zona donde el cache dejó de ser un atajo. Una lectura sana de Redis en
      # la misma red es de un dígito en milisegundos; 150 ms es 20 veces eso.
      slow-call-duration-threshold: 150ms
      slow-call-rate-threshold: 60
      # Un failover de Redis o un reinicio de contenedor tarda del orden de 5
      # a 15 s. Menos de 10 s sería probar contra algo que todavía no volvió,
      # y cada ronda de prueba cuesta 5 × 200 ms.
      wait-duration-in-open-state: 10s
      permitted-calls-in-half-open-state: 5
      # La recuperación no puede depender de que llegue tráfico.
      automatic-transition-from-open-to-half-open: true
      # La ventana cuenta llamadas, pero además caduca. Contar sin caducar
      # tiene el defecto inverso al de una ventana temporal: cien llamadas
      # pueden abarcar horas de madrugada, y fallos de un incidente ya
      # resuelto mantendrían el circuito al borde de abrir.
      window-max-age: 10m
    # El total de una paginación es una pista para la interfaz, no un
    # invariante de negocio: que esté 45s desactualizado no rompe nada, y a
    # cambio hace innecesaria una invalidación que sería imposible de calcular.
    reservation-count-ttl: 45s
    # Acá sí hay invalidación activa en cada escritura. El TTL es la red de
    # seguridad para cuando se pierda: acota el daño a un minuto en lugar de
    # dejarlo permanente.
    reservation-version-ttl: 60s

  airport-catalog:
    # El maestro de aeropuertos cambia muy poco y se consulta en cada operación.
    cache-ttl: 30m
    # Más corto que el positivo: un código que hoy no existe puede darse de alta,
    # y el costo de equivocarse es rechazar una reserva válida.
    negative-cache-ttl: 5m
    # Ventana para servir el último valor conocido si el catálogo devuelve 5xx,
    # 429 o no contesta. Convierte una caída del proveedor en una degradación
    # silenciosa en lugar de un rechazo masivo de reservas.
    stale-while-error: 2h
    # Catálogo de ciudades: las ciudades del itinerario se validan contra este
    # servicio en cada POST y PUT. Coincide con el 'api-catalog' de
    # compose.yaml, así que 'docker compose up -d' y listo.
    #
    # Vaciar 'base-url' vuelve al stub en memoria: es lo que usan los tests,
    # para que el build no dependa de un servicio externo.
    #
    # El http:// de acá es el contenedor de al lado en la máquina de
    # desarrollo. Fuera de localhost la URL tiene que ser https:// y la
    # aplicación se niega a arrancar si no lo es: la API key viaja en un
    # header, así que en texto plano se lee y se roba en el camino.
    base-url: ${CATALOG_BASE_URL:http://localhost:6070/api/flights/catalog}
    # La credencial nunca va en el archivo: viene del entorno. Hoy el catálogo
    # no pide autenticación, así que sin la variable no se manda el header.
    api-key: ${CATALOG_API_KEY:}
    api-key-header: X-API-Key
    # Timeouts de este proveedor, no globales: el read timeout que tolera el
    # catálogo no tiene por qué ser el del próximo servicio que se integre.
    #
    # Sin read timeout, una llamada contra un proveedor que acepta la conexión
    # y no contesta queda colgada hasta que corte el sistema operativo, y con
    # ella el pedido de reserva. Con un pool de 20 conexiones, unas pocas de
    # esas convierten la degradación del catálogo en una caída nuestra.
    # Establecer una conexión es rápido o no va a pasar: en la misma red el
    # handshake TCP son microsegundos y 300 ms cubren un DNS lento. Bajó de
    # 500 ms porque ahora forma parte del techo por intento —300 + 700 = 1 s
    # exactos—, y un techo redondo es más fácil de razonar en el presupuesto.
    connect-timeout: 300ms
    # GET /city/{code} es un lookup por clave contra una tabla de unos pocos
    # miles de ciudades: el tiempo de servicio esperado es de un dígito en
    # milisegundos. 700 ms son ~20× el p99 esperado, que cubre una pausa de GC
    # del proveedor y un salto de red, y no más. Los 2 s de antes eran ~200× y
    # se eligieron cuando no había presupuesto de pedido que respetar.
    #
    # Es el primer valor que hay que reemplazar por el medido: en cuanto
    # 'http.client.requests' publique el histograma del catálogo, este timeout
    # pasa a ser p99 × 5.
    read-timeout: 700ms
    # EL TECHO DEL PEDIDO, y la pieza que faltaba.
    #
    # Sale del presupuesto del POST hacia atrás: 4 s de objetivo − 2 s de
    # persistencia − 0,4 s de todo lo demás. Alcanza para un intento completo
    # (1 s) más un reintento parcial.
    #
    # Es del ITINERARIO, no de la ciudad: las ciudades se resuelven en
    # paralelo sobre hilos virtuales con un único vencimiento, así que once
    # ciudades cuestan la más lenta y no la suma. Lo que no contestó cuando
    # vence se trata como no disponible y entra al fallback; nunca se acepta
    # una ciudad sin validar para ganar tiempo.
    itinerary-budget: 1600ms
    retry:
      # Sólo aplican a GET /city/{code}, que es una lectura idempotente:
      # repetirla no puede duplicar ni cambiar nada. Las escrituras del sistema
      # siguen sin reintentarse; la única repetición admitida de un POST es la
      # del cliente con la misma Idempotency-Key.
      #
      # Qué se reintenta lo decide un único clasificador de fallos, el mismo
      # que alimenta al circuito: transitorio (5xx, timeout, error de
      # conexión) sí; 429, 4xx de integración y cuerpo fuera de contrato, no.
      # El 429 SÍ cuenta para el circuito pero NO se reintenta: insistir es
      # desobedecer al proveedor que acaba de pedir que bajemos el ritmo.
      #
      # DOS intentos y no tres. El primer reintento recupera el microcorte,
      # que es el 90 % de los fallos transitorios de red; el tercero cuesta
      # 1,2 s más de peor caso y sólo ayuda si el proveedor se cae y se
      # recupera en menos de 400 ms. Peor caso por ciudad: 1 s + 200 ms + 1 s
      # = 2,2 s, que el presupuesto del itinerario recorta a 1,6 s.
      max-attempts: 2
      initial-backoff: 100ms
      # Techo de la espera. Baja de 500 ms porque con dos intentos el tercer
      # escalón no se usaría nunca, y 200 ms es lo que entra en el
      # presupuesto. El jitter se sortea sobre la mitad superior del valor
      # calculado: desincroniza N instancias sin hacer impredecible el techo,
      # que es lo que el presupuesto necesita para poder calcularse.
      max-backoff: 200ms
    bulkhead:
      # El reemplazo explícito del backpressure que los threads virtuales
      # quitaron. El api-catalog es una aplicación con un pool a su base del
      # orden de diez conexiones: más de ~50 pedidos nuestros en vuelo no se
      # atienden más rápido, se encolan adentro de él, y ahí nuestro timeout
      # se convierte en su saturación. 50 permisos con espera CERO hacen que
      # la cola sea nuestra —y visible— en lugar de suya.
      max-concurrent-calls: 50
    circuit-breaker:
      enabled: ${CATALOG_CIRCUIT_ENABLED:true}
      # Un itinerario típico son 4 ciudades y uno complejo 11. 20 llamadas son
      # unos pocos itinerarios: suficiente para que una ráfaga desafortunada
      # de un solo pedido no abra el circuito, y poco como para detectar una
      # caída en segundos. La ventana de 50 le da memoria de ~7 itinerarios.
      sliding-window-size: 50
      minimum-number-of-calls: 20
      # Por encima de la mitad ya no hay duda de que el problema es del
      # proveedor. Más bajo abriría ante un proveedor parcialmente degradado
      # que todavía sirve la mitad de las consultas —y media validación buena
      # vale más que ninguna—; más alto retrasaría la apertura hasta que casi
      # todo falle.
      failure-rate-threshold: 50
      # Apenas por debajo del techo de un intento (1 s): si una resolución
      # tardó eso, el primer intento ya agotó su timeout. Es el modo de falla
      # «lento» detectado ANTES de que se convierta en errores, que es la
      # única forma de que el circuito ayude con una dependencia lenta en
      # lugar de caída.
      slow-call-duration-threshold: 900ms
      slow-call-rate-threshold: 60
      # Corto a propósito, y el número que más se aparta del default de 60 s
      # de la librería: el fallback sirve datos que envejecen, así que cada
      # segundo abierto cuesta frescura, y probar es barato (4 llamadas de
      # ≤ 1 s). Con 5 s, una caída de un minuto se paga con ~12 rondas de
      # prueba y la recuperación se detecta en 5 s.
      wait-duration-in-open-state: 5s
      # Con 4 llamadas, el umbral del 50 % se decide con 2 fallos; y 4 es el
      # tamaño de un itinerario típico, así que una sola reserva alcanza para
      # decidir si el proveedor volvió.
      permitted-calls-in-half-open-state: 4
      # La restricción «un circuito abierto no puede ser permanente»: sin
      # esto, la vuelta a semiabierto depende de que llegue una llamada, y un
      # circuito que se abrió justo cuando el tráfico cayó se quedaría abierto
      # hasta el próximo pedido.
      automatic-transition-from-open-to-half-open: true
      window-max-age: 10m
  security:
    jwt:
      # ---------------------------------------------------------------------
      # Modo de cualquier entorno real: el JWKS del proveedor de identidad.
      # Las claves las publica el emisor, rotan sin que toquemos nada y este
      # servicio nunca ve una clave privada. Tiene que ser HTTPS: la
      # aplicación se niega a arrancar con un JWKS por http:// que no sea
      # localhost, porque quien esté en el camino podría servir otras claves.
      # ---------------------------------------------------------------------
      jwk-set-uri: ${JWT_JWK_SET_URI:}
      # Emisor y audiencia esperados. La audiencia es la que impide que un
      # token que el mismo IdP emitió para OTRO servicio sirva acá: sin ella,
      # cada aplicación del emisor es un camino de entrada a ésta.
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}

      # ---------------------------------------------------------------------
      # Modo local y de tests. Acepta tokens HMAC firmados con la clave de
      # abajo, que es un placeholder publicado y NO un secreto: con ella
      # cualquiera que lea el repositorio se emite un token.
      #
      # Existe para que 'mvn spring-boot:run' y 'mvn verify' no dependan de un
      # IdP levantado, que es el mismo criterio que con Redis y con el catálogo.
      # Apagarlo sin configurar 'jwk-set-uri' hace fallar el arranque a
      # propósito: no hay ninguna combinación que produzca una API sin validar
      # tokens.
      # ---------------------------------------------------------------------
      dev-tokens: ${SECURITY_DEV_TOKENS:true}
      dev-secret: ${JWT_DEV_SECRET:dev-only-hmac-key-no-usar-fuera-de-local-0123456789}

    pii:
      # Clave AES-256 (Base64) con la que se cifra el documento del pasajero en
      # la base. El valor de abajo es, otra vez, un placeholder de desarrollo
      # reconocible: la aplicación avisa en cada arranque cuando lo está usando.
      # En cualquier otro entorno viene del gestor de secretos.
      #
      # Rotarla no es cambiar esta línea: el formato de la columna lleva
      # prefijo de versión justamente para poder convivir con dos claves
      # durante una rotación.
      key: ${PII_ENCRYPTION_KEY:ZGV2LW9ubHkta2V5LTMyLWJ5dGVzLWRlbW8tMDEyMzQ=}

    cors:
      # Allowlist explícita por entorno, nunca '*'. Vacía deja CORS apagado,
      # que es lo correcto en local: los tests y curl no lo necesitan, y así el
      # default no habilita a nadie.
      #
      #   CORS_ALLOWED_ORIGINS=https://app.edteam.example,https://m.edteam.example
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
      max-age: 30m

    rate-limit:
      # Última línea, no la primera: el lugar del rate limiting es el gateway,
      # donde el pedido se rechaza antes de gastar un hilo y donde la cuenta es
      # una sola para todas las instancias. Acá cada instancia lleva la suya,
      # así que con N instancias la cuota efectiva es N veces ésta.
      enabled: ${RATE_LIMIT_ENABLED:true}
      window: 1m
      # Una pantalla que refresca cada 5s consume 12 por minuto: 120 deja
      # margen de sobra y corta a un scraper recorriendo identificadores.
      reads: ${RATE_LIMIT_READS:120}
      # Las escrituras van aparte porque son mucho más caras: un alta es una
      # transacción, hasta 8 consultas al catálogo en serie y una fila nueva en
      # el maestro de usuarios.
      writes: ${RATE_LIMIT_WRITES:20}

  messaging:
    # Apagarlo deja el publicador que sólo loguea: la aplicación arranca y los
    # tests corren sin broker, igual que arrancan sin Redis y sin el catálogo.
    # Encendido sin broker levantado NO impide arrancar: los eventos se
    # acumulan en el outbox y salen cuando el broker vuelve.
    enabled: ${MESSAGING_ENABLED:true}
    # Topic exchange al que publica el relay. Es lo ÚNICO que el productor
    # necesita conocer de la topología: no nombra ninguna cola ni ningún
    # destinatario, así que un consumidor nuevo se suscribe sin que cambie una
    # línea de código nuestro.
    exchange: reservations.events
    # Va en el envelope. Distingue entornos: sin esto, un mensaje de staging
    # que llegue por error a una cola productiva se procesa como productivo.
    source: ${MESSAGING_SOURCE:urn:edteam:flight-reservations}
    confirm-timeout: 5s
    # Sólo en local: declara también las colas del consumidor para que
    # 'docker compose up' deje el circuito completo andando. En cualquier otro
    # entorno se declara únicamente el exchange y cada consumidor declara y ata
    # su propia cola.
    declare-consumer-topology: ${MESSAGING_DECLARE_CONSUMER_TOPOLOGY:true}
    # Consumidor de referencia de este repositorio. En producción el consumidor
    # es el servicio de notificaciones, que es su dueño.
    consumer-enabled: ${MESSAGING_CONSUMER_ENABLED:true}
    # Backoff del consumidor. Vive en la TTL de la cola de espera y no en un
    # sleep del handler: dormir adentro ocupa el canal y frena los mensajes
    # sanos que venían detrás del venenoso.
    # Primer escalón del backoff del consumidor. Ya no es la espera fija de
    # todas las vueltas: es el punto de partida de una progresión exponencial
    # con jitter que el listener escribe como vencimiento de cada mensaje.
    #
    # Con la espera fija, todos los mensajes que fallaban juntos volvían
    # JUNTOS, exactamente 30 s después, contra un destino que seguía caído:
    # cinco vueltas sincronizadas en 150 s y una caída de más de dos minutos y
    # medio vaciaba la cola hacia la dead letter en bloque.
    retry-delay: 30s
    # Techo del backoff del consumidor, y TTL de la cola de espera. Con 5
    # vueltas la progresión es 30 s, 1 m, 2 m, 4 m, 8 m: casi 16 minutos de
    # tolerancia en lugar de 150 segundos.
    max-retry-delay: 10m
    max-retry-rounds: 5
    # Al llenarse, la cola rechaza la publicación en lugar de descartar en
    # silencio: la fila se acumula en el outbox, que es donde se puede ver,
    # medir y drenar.
    queue-max-length: 100000
    # La cola de ESPERA también tiene cota, con el mismo criterio. Sin ella,
    # con el destino caído crece sin límite en el broker y la alarma de disco
    # de RabbitMQ termina frenando las publicaciones del relay: la falta de un
    # límite en una cola interna se convierte en la caída del broker entero.
    # Un orden de magnitud menos que la principal, porque es un buffer de
    # reintentos y no un backlog.
    retry-queue-max-length: 10000
    circuit-breaker:
      # Este circuito NO protege latencia: nadie espera una publicación.
      # Protege el presupuesto de reintentos del mensaje, que es lo que separa
      # «la notificación llegó tarde» de «la notificación hay que reenviarla a
      # mano». Con el circuito abierto el relay no gasta intentos.
      enabled: ${BROKER_CIRCUIT_ENABLED:true}
      # Mucho más bajos que los del catálogo: el relay publica poco y en
      # lotes, así que pedir 20 llamadas mínimas retrasaría la apertura hasta
      # la mitad del primer lote. Cinco fallos consecutivos de publicación
      # contra un broker no son ambiguos.
      sliding-window-size: 20
      minimum-number-of-calls: 5
      # Más alto que el resto porque un fallo aislado puede ser una cola llena
      # por reject-publish de un solo routing key y no el broker entero. Con 5
      # llamadas mínimas, 3 fallos abren.
      failure-rate-threshold: 60
      # Un publisher confirm contra un broker sano es de un dígito en
      # milisegundos. Por encima de 2 s el broker está bajo control de flujo o
      # con alarma de disco: sigue contestando, pero el relay no va a drenar
      # la cola a ese ritmo. El confirm-timeout de 5 s queda como corte duro.
      slow-call-duration-threshold: 2s
      slow-call-rate-threshold: 60
      # El único caso donde el default largo es el correcto: nadie espera, el
      # mensaje está a salvo en el outbox y PROBAR ES CARO (2 s de connect +
      # 5 s de confirm por prueba). Además el backoff del outbox ya trabaja en
      # la escala de 5 s a 5 m, así que 60 s no atrasan nada.
      wait-duration-in-open-state: 60s
      # Una publicación de prueba por tick, dos ticks para decidir. La sonda
      # toma un mensaje AL AZAR y no el más viejo, y no le gasta el intento.
      permitted-calls-in-half-open-state: 2
      automatic-transition-from-open-to-half-open: true
      # Más larga que la de las otras dos: el relay publica poco, así que 20
      # llamadas pueden abarcar bastante tiempo aun con tráfico normal.
      window-max-age: 30m

  outbox:
    # Relay de los hechos hacia el broker.
    dispatch-enabled: ${OUTBOX_DISPATCH_ENABLED:true}
    dispatch-interval: 5s
    batch-size: 50
    # Ochenta, y el número tiene una historia. Con diez, el par
    # (initial-backoff 5s, max-backoff 5m, max-attempts 10) agotaba los diez
    # intentos en 20 minutos de reloj: el techo de seis horas de abajo NO
    # participaba nunca. Eran dos números que decían cosas distintas, y el que
    # mandaba era el que no describía la intención — una caída del broker de
    # más de 20 minutos mandaba TODO el outbox a FAILED y había que drenar la
    # dead letter a mano.
    #
    # Con 80, los intentos cubren ~6,5 h de reloj y el corte vuelve a ser el
    # techo de tiempo, que es el que expresa «seis horas reintentando es un
    # problema que ya tiene dueño». max-attempts vuelve a ser lo que su
    # comentario decía: la red por si el backoff queda mal configurado. La
    # aplicación avisa al arrancar si los dos vuelven a divergir.
    max-attempts: 80
    # El corte que describe de verdad un fallo transitorio largo: seis horas
    # reintentando es un problema que ya tiene dueño y alerta. Manda el que
    # llegue primero entre esto y max-attempts.
    retry-ceiling: 6h
    # Mismo vocabulario que los reintentos del catálogo de ciudades. El jitter
    # se sortea sobre el intervalo calculado, para que N instancias que
    # fallaron juntas no reintenten todas en el mismo instante.
    initial-backoff: 5s
    max-backoff: 5m
    # Cuánto vale un reclamo del relay. Si el proceso muere entre el reclamo y
    # la publicación, al vencer esto el mensaje vuelve a ser elegible: es lo
    # que impide que una caída deje mensajes trabados para siempre.
    #
    # Es un PISO, no el valor final: la aplicación lo eleva al peor caso de un
    # tick (batch-size × confirm-timeout + margen) si éste es mayor. Con lotes
    # de 50 y confirms de 5 s, ese peor caso son más de cuatro minutos contra
    # un broker que acepta y no confirma, así que dos minutos dejaban que otra
    # instancia re-reclamara mensajes todavía en vuelo — y el markFailed
    # tardío del primero devolvía a PENDING un mensaje ya despachado.
    claim-lease: 2m
    # Purga de los despachados. Sin esto la tabla crece indefinidamente. Los
    # ids deduplicados del consumidor se conservan MÁS que esto: mientras un
    # mensaje pueda reenviarse, su id tiene que seguir guardado.
    retention: 7d
    purge-enabled: ${OUTBOX_PURGE_ENABLED:true}
    purge-cron: "0 17 3 * * *"

springdoc:
  # No se declara 'springdoc.open-api.servers': sin esa lista, el documento sale
  # con el origen del pedido que lo pidió, así que Swagger UI ejecuta siempre
  # contra el host desde el que se la está mirando (en local, localhost:8080).
  #
  # Con una lista fija encabezada por producción, el botón "Try it out" del
  # entorno local dispararía pedidos reales contra producción. Si un entorno
  # necesita publicar su lista de servidores, la declara acá sin tocar código:
  #
  #   open-api:
  #     servers:
  #       - url: https://api.edteam.example
  #         description: Producción
  #       - url: https://api.sandbox.edteam.example
  #         description: Sandbox para integraciones de partners
  api-docs:
    # El documento generado. Es la fuente de verdad del contrato: sale de los
    # controllers, los DTOs y sus anotaciones, así que no puede quedar viejo.
    #
    # Apagado por defecto, igual que Swagger UI y por el mismo motivo: el mapa
    # completo de la API le ahorra la mitad del trabajo a quien la esté
    # explorando. Encendido se sirve SIN token, porque exigirlo dejaría la UI
    # inusable —una navegación del navegador no lleva header Authorization—
    # sin proteger nada. El control es este interruptor: en producción el
    # endpoint no existe, y el contrato que leen los partners sale del archivo
    # versionado en docs/api/openapi.yaml, no del runtime.
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs
    # Fijada en 3.0. El default de springdoc 2.x es 3.1.0, y el archivo
    # versionado en docs/api/openapi.yaml declaraba 3.0.3 porque se lo había
    # convertido a mano: el runtime y la copia publicada decían cosas
    # distintas. Fijarla acá elimina el paso manual —el archivo se regenera
    # tal cual sale— y de paso mantiene la compatibilidad con las
    # herramientas de partners que todavía no leen 3.1.
    version: openapi_3_0
  # Claves ordenadas: dos generaciones del mismo código producen el mismo
  # archivo, así el documento se puede versionar y su diff se puede revisar.
  writer-with-order-by-keys: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    display-request-duration: true
    # Apagada por defecto: una UI que ejecuta pedidos reales contra la API
    # productiva no va abierta. Se enciende en los entornos donde sirve
    # (SWAGGER_UI_ENABLED=true en local y en sandbox), y ahí se sirve sin token
    # —si no, no habría forma de llegar a la pantalla donde autorizarse—.
    #
    # Lo que la UI ejecuta sí exige token: 'Try it out' pega contra /v1/**
    # como cualquier otro cliente, así que hay que pegar un Bearer en el botón
    # 'Authorize' para que devuelva algo que no sea un 401.
    enabled: ${SWAGGER_UI_ENABLED:true}

management:
  server:
    # Actuator en un puerto propio, que no se publica hacia afuera: el
    # balanceador y el ingress exponen 8080 y nada más. 'metrics' revela
    # volumetría de negocio —cuántas reservas por minuto, cuántas fallan— y
    # 'http.server.requests' revela la superficie real de la API, incluidos los
    # endpoints que el contrato no documenta.
    #
    # Es la mitigación estructural: no hace falta acertar con las reglas de
    # autorización de cada endpoint de gestión si el puerto no es alcanzable.
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        # Sondas de readiness/liveness para el orquestador, más las métricas:
        # sin ellas no hay forma de saber si el cache acierta ni de enterarse el
        # día que deja de hacerlo.
        # Sondas de readiness/liveness para el orquestador, las métricas y las
        # dos dead letters. 'outbox' y 'messaging-dlq' son la contracara
        # obligatoria de la métrica que alerta: sin ellas se sabe que algo se
        # perdió y no hay forma de verlo ni de reenviarlo.
        # 'prometheus' incluido: /actuator/metrics devuelve un medidor por vez
        # en JSON, que sirve para mirar y no para alertar. Sin un endpoint
        # raspable no hay forma de responder, sin entrar al servidor, si un
        # circuito está abierto y hace cuánto — y las alertas con umbral que
        # el diseño justifica no tienen de dónde salir.
        #
        # Lo que se abre es la LECTURA DE MÉTRICAS, no la superficie de la
        # API: el puerto de gestión sigue sin publicarse hacia afuera.
        include: health,info,metrics,prometheus,outbox,messaging-dlq
  endpoint:
    health:
      probes:
        enabled: true
  health:
    rabbit:
      # Apagado, por el mismo motivo que el de Redis: el broker caído degrada
      # —los eventos se acumulan en el outbox— y no impide responder pedidos.
      # Marcarnos DOWN nos sacaría de rotación por algo que no afecta al
      # cliente. Que el broker esté caído se ve en el lag del outbox, que es la
      # métrica que mide el daño real.
      enabled: false
    redis:
      # Apagado a propósito. El cache es opcional por diseño y su caída degrada
      # al origen sin afectar al cliente; dejar que marque la aplicación como
      # DOWN la sacaría de rotación por un componente del que no depende para
      # responder.
      enabled: false

logging:
  level:
    com.edteam.reservations: INFO
