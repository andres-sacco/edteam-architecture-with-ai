# Tempo en modo monolítico, recibiendo OTLP por HTTP.
#
# La aplicación exporta sólo con TRACING_EXPORT_ENABLED=true: apagado por
# defecto, para que el proceso arranque sin este contenedor igual que arranca
# sin Redis, sin broker y sin catálogo.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
