# =============================================================================
# flight-reservations — integración continua y publicación de la imagen
# =============================================================================
#
# Cinco trabajos y un grafo que se lee de una sola forma:
#
#     unit ─────────┬──▶ image   (construye siempre; publica sólo desde main)
#                   │
#     integration ──┴──▶ sonar   (análisis y quality gate)
#
#     security-scan            (no espera a nadie y nadie lo espera)
#
# 'image' y 'sonar' declaran los dos 'needs: [unit, integration]'. En GitHub
# Actions un trabajo con 'needs' NO arranca si alguno de los que espera falló o
# fue cancelado: no hay forma de que se publique una imagen de un commit cuyos
# tests no pasaron.
#
# 'image', 'sonar' y 'security-scan' corren EN PARALELO y ninguno depende de
# otro. Es deliberado: ni el análisis estático ni el escaneo de dependencias
# tienen por qué demorar la publicación de un artefacto cuyos 798 tests ya
# pasaron, y la caída de un servicio externo (sonarcloud.io, el NVD) no tiene
# por qué impedir que se publique una imagen.
#
# Eso no los convierte en informes decorativos. Los dos fallan de verdad
# —quality gate y failBuildOnCVSS— y el lugar donde eso frena algo es el pull
# request, declarándolos required status checks: ahí una decisión de calidad o
# de seguridad se puede discutir y arreglar antes de que entre a main.
#
# 'security-scan' además no espera a los tests: es el trabajo más lento (la
# base del NVD) y no necesita que nada compile para resolver el árbol de
# dependencias, así que arranca en t=0.
#
# No hay un solo 'continue-on-error' en este archivo. Convierte un paso rojo en
# un trabajo verde: el grafo sigue y la imagen se publica igual. Un pipeline
# así es más peligroso que no tener pipeline, porque además da una señal de
# éxito.
#
# 'if: always()' aparece sólo en los pasos que PUBLICAN RESULTADOS (el resumen
# de tests, la subida de los XML), que tienen que correr justamente cuando la
# suite falló — si no, el único caso en el que el reporte hace falta es el
# único en el que no se genera.

name: CI

on:
  # --- Rama de trabajo: sólo los tests ----------------------------------------
  # El autor necesita saber en minutos si rompió algo, en la rama donde lo
  # rompió y antes de abrir el PR. No se construye la imagen acá: son ~1,5
  # minutos más en el bucle corto, y lo que la imagen verifica —que el
  # Dockerfile siga construyendo— se verifica igual en el PR, antes de que
  # llegue a main.
  push:
    branches:
      - 'main'
      - 'modulo*/clase*'

  # --- Pull request hacia main: todo, menos publicar --------------------------
  # El evento 'push' prueba la PUNTA DE LA RAMA. El evento 'pull_request'
  # prueba 'refs/pull/N/merge': el resultado de fusionar esa rama con el main
  # ACTUAL. Son dos commits distintos y dos riesgos distintos — la rama puede
  # estar verde y romperse al integrarse con algo que entró a main mientras
  # tanto. Lo que se protege con un required status check es este evento.
  #
  # Un PR desde un fork dispara este evento con un GITHUB_TOKEN de sólo lectura
  # y SIN acceso a los secretos del repositorio: lo garantiza GitHub, no este
  # archivo. Por eso el CI de un PR externo es seguro; 'image' no publica y
  # 'sonar' se saltea (ver sus condiciones).
  pull_request:
    branches:
      - 'main'

# Cancelar la corrida anterior de la MISMA referencia cuando llega un push
# nuevo: nadie necesita el resultado de un commit que ya quedó atrás, y en una
# rama activa eso es la mitad de los minutos de runner.
#
# En main NO se cancela. Una corrida de main puede estar en mitad de un push al
# registro; matarla deja una etiqueta apuntando a una imagen a medio subir.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Permiso mínimo por defecto para TODO el workflow: leer el código y nada más.
# Cada trabajo agrega, sobre esta base, sólo lo que usa. Sin esta línea el
# token hereda los permisos por defecto de la organización, que en repositorios
# viejos siguen siendo de escritura sobre casi todo.
permissions:
  contents: read

env:
  # Ni un solo valor de acá es secreto. El único secreto del workflow es
  # SONAR_TOKEN; el registro se autentica con el GITHUB_TOKEN efímero que
  # GitHub emite para cada corrida y que nadie tiene que crear ni rotar.
  REGISTRY: ghcr.io
  IMAGE_NAME: flight-reservations
  # Java: el mismo 21 que fija .sdkmanrc y que declara <java.version> del pom.
  # Temurin, el mismo proveedor que la imagen de ejecución del Dockerfile.
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: temurin
  MAVEN_ARGS: '-B -ntp --errors'

jobs:

  # ===========================================================================
  # 1. Tests unitarios — el ciclo corto
  # ===========================================================================
  # 650 tests, sin Docker y sin red. Acá viven los dos guardianes que tienen
  # que frenar el pipeline: HexagonalArchitectureTest (ArchUnit) y
  # OpenApiContractTest. Están en surefire, no en failsafe, así que este
  # trabajo los corre y no hace falta esperar a los de integración para saber
  # que la arquitectura o el contrato se rompieron.
  #
  # Corre EN PARALELO con 'integration' y no antes. El motivo es el tiempo de
  # respuesta, no el total: el camino crítico lo fija igual el trabajo largo,
  # pero la falla más frecuente —un test unitario, una regla de ArchUnit— se ve
  # a los ~2 minutos en lugar de a los ~4. El costo es compilar dos veces, y en
  # un repositorio público los minutos de runner son gratis.
  unit:
    name: Tests unitarios
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Sin historial: este trabajo no lo usa y clonar 1 commit en lugar de
          # todo el repositorio ahorra varios segundos. ('sonar' sí lo necesita
          # y ahí se pide completo.)
          fetch-depth: 1
          persist-credentials: false

      - name: JDK ${{ env.JAVA_VERSION }} + caché del repositorio Maven
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          # Cachea ~/.m2/repository con clave sobre el hash de pom.xml. Son
          # ~400 MB que, en frío, se bajan en ~90 s y en caliente se restauran
          # en ~15 s. La clave es el hash del POM y no la rama: dos ramas con
          # las mismas dependencias comparten la misma entrada.
          cache: maven

      - name: Compilar y correr los unitarios
        # './mvnw test' y no './mvnw verify': failsafe (*IT) no corre acá.
        # El gate de PII tampoco, porque está atado a la fase 'verify' — corre
        # en el trabajo de integración, que es donde además hay salida de los
        # tests de integración para revisar.
        run: ./mvnw ${{ env.MAVEN_ARGS }} test

      - name: Reporte de tests en el resumen del workflow
        # 'always()' a propósito y SÓLO acá: el reporte hace falta sobre todo
        # cuando la suite falló. El paso anterior ya marcó el trabajo como
        # fallido; este no lo rescata, sólo explica por qué.
        if: ${{ always() }}
        run: python3 scripts/ci-test-summary.py target/surefire-reports

      - name: Verificar que docs/api/openapi.yaml no quedó viejo
        # OpenApiContractTest compara el documento que genera springdoc contra
        # el CÓDIGO (los handler mappings, los códigos de estado del
        # @RestControllerAdvice, los esquemas de seguridad). Eso deja una
        # brecha: el archivo versionado que leen los partners puede estar
        # atrasado respecto del documento generado sin que ningún test falle.
        #
        # Esto la cierra: regenera el archivo con el volcador que el
        # repositorio ya tiene y exige que el resultado sea idéntico al
        # commiteado. Si difiere, el build falla y el mensaje dice el comando
        # exacto para arreglarlo.
        run: |
          ./mvnw ${{ env.MAVEN_ARGS }} test -Dtest=OpenApiDocumentDumpTest -Dopenapi.dump=true -DfailIfNoTests=false
          if ! git diff --quiet -- docs/api/openapi.yaml; then
            {
              echo "## ❌ Contrato OpenAPI desactualizado"
              echo ""
              echo "\`docs/api/openapi.yaml\` no coincide con lo que springdoc genera desde el código."
              echo "Regeneralo y commiteá el resultado:"
              echo ""
              echo '```bash'
              echo './mvnw test -Dtest=OpenApiDocumentDumpTest -Dopenapi.dump=true'
              echo '```'
              echo ""
              echo "<details><summary>Diferencia</summary>"
              echo ""
              echo '```diff'
              git --no-pager diff -- docs/api/openapi.yaml | head -200
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error file=docs/api/openapi.yaml::El contrato versionado no coincide con el generado desde el codigo. Regeneralo con: ./mvnw test -Dtest=OpenApiDocumentDumpTest -Dopenapi.dump=true"
            exit 1
          fi

      - name: Guardar los XML de surefire
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports-${{ github.run_id }}
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

  # ===========================================================================
  # 2. Tests de integración — PostgreSQL y RabbitMQ reales
  # ===========================================================================
  # 148 tests que levantan contenedores con Testcontainers. Necesitan el
  # demonio Docker del runner, que ubuntu-24.04 ya trae: por eso estos tests
  # corren acá y NO dentro del 'docker build' (ver el comentario del Dockerfile
  # sobre -DskipTests).
  #
  # Este trabajo es además el que produce la COBERTURA que consume Sonar.
  # './mvnw verify' corre los dos agentes de JaCoCo —uno por surefire y otro
  # por failsafe, porque forkean JVMs distintas—, mezcla los dos .exec y emite
  # un único jacoco.xml. Medir sólo los unitarios dejaría a los adaptadores de
  # salida pareciendo sin tests, que es exactamente lo contrario de la verdad.
  #
  # La suite no necesita ninguna credencial externa: los tokens son HMAC de
  # desarrollo, el catálogo externo se reemplaza por un stub cuando 'base-url'
  # está vacío y la mensajería se apaga por propiedad. Este trabajo, entonces,
  # no recibe un solo secreto — lo que también significa que puede correr sin
  # riesgo sobre un PR de un fork.
  integration:
    name: Tests de integración
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read

    env:
      # Ryuk es el contenedor que limpia los contenedores huérfanos cuando la
      # JVM muere sin ordenar. En un runner efímero —la VM entera se destruye
      # al terminar el trabajo— no hay nada que limpiar: apagarlo ahorra un
      # contenedor, su pull y unos segundos de arranque en cada corrida.
      # NO hacer esto en una máquina de desarrollo, donde sí deja basura.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      TESTCONTAINERS_CHECKS_DISABLE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: JDK ${{ env.JAVA_VERSION }} + caché del repositorio Maven
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Pre-descargar las imágenes de Testcontainers
        # Etiquetas EXACTAS, las mismas que declaran AbstractPostgresIT y
        # AbstractRabbitIT. Bajarlas acá y no dentro del test tiene dos
        # efectos: el pull ocurre en paralelo (los dos '&' y el 'wait'), y el
        # tiempo de descarga deja de contar contra el timeout de arranque de
        # Testcontainers — que es de dónde salen los fallos intermitentes que
        # se reintentan a mano y terminan enseñando a desconfiar del pipeline.
        run: |
          docker pull --quiet postgres:17-alpine &
          docker pull --quiet rabbitmq:4-management-alpine &
          wait

      - name: Suite completa + cobertura + gate de PII
        # './mvnw verify' corre surefire, después failsafe, después la mezcla y
        # el informe de JaCoCo, y al final el exec-maven-plugin con
        # scripts/pii-log-gate.sh, que grepea la salida capturada de TODA la
        # suite contra los patrones de datos personales. Cualquiera de los
        # cuatro que falle deja este trabajo en rojo, y con él 'image' y
        # 'sonar'.
        run: ./mvnw ${{ env.MAVEN_ARGS }} verify

      - name: Reporte de tests en el resumen del workflow
        if: ${{ always() }}
        run: python3 scripts/ci-test-summary.py target/surefire-reports target/failsafe-reports

      - name: Guardar los XML de surefire y failsafe
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Guardar lo que necesita Sonar
        # Clases compiladas + informe de cobertura + resultados de los tests.
        # Son ~4 MB y evitan que el trabajo de análisis tenga que volver a
        # compilar y a correr los 798 tests, que serían cuatro minutos más de
        # camino crítico. Además garantiza que Sonar analice EXACTAMENTE el
        # bytecode que se probó, y no uno recompilado que podría diferir.
        #
        # Del informe de cobertura va SÓLO el jacoco.xml, que es lo único que
        # Sonar lee. El directorio entero son 6,5 MB porque incluye el informe
        # HTML navegable, que acá no lo mira nadie.
        #
        # Los cinco caminos cuelgan de 'target/', así que la acción usa ese
        # directorio como raíz del artefacto y el 'download' de abajo lo
        # restituye tal cual.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonar-input-${{ github.run_id }}
          path: |
            target/classes/
            target/test-classes/
            target/site/jacoco-merged/jacoco.xml
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 1
          if-no-files-found: error

  # ===========================================================================
  # 3. Análisis estático y cobertura — SonarQube Cloud
  # ===========================================================================
  # Corre en paralelo con 'image'. No lo bloquea y no lo bloquea nadie: el
  # quality gate es una decisión sobre la calidad del código, y el lugar donde
  # se toma es el pull request. Configurar este trabajo como required status
  # check sobre main es lo que le da dientes.
  sonar:
    name: SonarQube Cloud
    needs: [unit, integration]
    # Se saltea en los PR de forks. No es una concesión: GitHub NO entrega
    # secretos a un workflow disparado por un fork, así que SONAR_TOKEN estaría
    # vacío y el escáner fallaría con un 401 que no dice nada sobre el código.
    # Es mejor un trabajo salteado y legible que uno rojo por un motivo que el
    # autor del PR no puede arreglar. El análisis de ese código ocurre igual
    # cuando el PR se mergea a main.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # fetch-depth: 0 — el historial COMPLETO, y es el único trabajo que
          # lo pide. Sonar usa el blame de git para dos cosas que son la mitad
          # de su valor: atribuir cada issue a quien la introdujo, y decidir
          # qué es "código nuevo" (que es sobre lo que el quality gate
          # realmente juzga). Con un clon superficial, todas las líneas
          # aparecen con la fecha del clon: el gate pasaría a evaluar el
          # repositorio entero en cada corrida y fallaría siempre.
          fetch-depth: 0
          persist-credentials: false

      - name: JDK ${{ env.JAVA_VERSION }} + caché del repositorio Maven
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Caché del analizador de Sonar
        # El escáner baja los plugins de análisis del servidor en cada corrida
        # (~100 MB). Cacheados son ~20 s menos por corrida. La clave no lleva
        # hash de nada porque el contenido no depende del código: se invalida
        # sola cuando SonarCloud publica analizadores nuevos y la restauración
        # parcial alcanza.
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-${{ runner.os }}

      - name: Recuperar clases y cobertura
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: sonar-input-${{ github.run_id }}
          path: target

      - name: Analizar y esperar el quality gate
        env:
          # El token es lo ÚNICO secreto del workflow. Entra por 'env' y no
          # interpolado dentro del 'run': '${{ ... }}' se sustituye
          # textualmente en el script antes de que exista un shell, así que un
          # valor con caracteres especiales dejaría de ser un dato. El escáner
          # lo lee de la variable de entorno solo; no se le pasa por bandera,
          # que quedaría en la lista de procesos.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Lo necesita el escáner para detectar el PR y decorarlo. Lo emite
          # GitHub para esta corrida, dura lo que dura el trabajo y acá se usa
          # en modo lectura.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::error::Falta el secreto SONAR_TOKEN. Generalo en SonarQube Cloud (My Account → Security) y cargalo en Settings → Secrets and variables → Actions."
            exit 1
          fi

          # 'sonar:sonar' SIN una fase del ciclo de vida por delante: el
          # artefacto que se bajó ya trae target/classes y el jacoco.xml, así
          # que no hay nada que compilar. Poner 'verify sonar:sonar' acá
          # volvería a correr los 798 tests para nada.
          #
          # Las coordenadas (host, organización, projectKey y de dónde leer la
          # cobertura) están en las <properties> del pom, no acá: así
          # './mvnw sonar:sonar' a mano apunta al mismo proyecto y no hay dos
          # lugares donde equivocarse.
          #
          # 'qualitygate.wait=true' es lo que convierte esto en un gate y no en
          # un informe. Sin esa bandera el escáner sube las métricas y termina
          # en verde pase lo que pase: el panel diría que la cobertura del
          # código nuevo cayó al 40% y el check seguiría estando OK. Cuesta
          # entre 30 y 90 s de espera mientras el servidor procesa, y por eso
          # este trabajo está fuera del camino de 'image'.
          ./mvnw ${MAVEN_ARGS} sonar:sonar -Dsonar.qualitygate.wait=true

      - name: Enlace al análisis
        if: ${{ always() }}
        run: |
          {
            echo "## 📊 SonarQube Cloud"
            echo ""
            echo "[Ver el análisis de este commit](https://sonarcloud.io/summary/new_code?id=andres-sacco_edteam-architecture-with-ai&branch=${GITHUB_REF_NAME})"
            echo ""
            echo "Si este trabajo está en rojo, es el quality gate: cobertura sobre código nuevo,"
            echo "duplicación, o issues nuevas. El detalle está en el enlace, por archivo y por línea."
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # 4. Seguridad — vulnerabilidades conocidas en las dependencias
  # ===========================================================================
  # SIN 'needs', a propósito, y es el único trabajo del archivo que no espera a
  # nadie. Es el más lento —la base del NVD— así que arranca en t=0 y no queda
  # detrás de los cuatro minutos de los tests. Y no depende de ellos: para
  # resolver el árbol de dependencias no hace falta que un test pase.
  #
  # Tampoco lo espera nadie: no bloquea 'image'. Mismo criterio que con Sonar.
  # Que se pueda publicar una imagen no puede quedar atado a la disponibilidad
  # del NVD, que es un servicio externo con límite de ritmo. Donde este trabajo
  # SÍ frena algo es en el pull request, como required status check — y ahí
  # frena de verdad, porque 'failBuildOnCVSS' lo deja en rojo.
  security-scan:
    name: Vulnerabilidades en dependencias
    runs-on: ubuntu-24.04
    # Treinta minutos y no diez: la primera corrida, con la caché del NVD
    # vacía, se baja la base entera. Las siguientes son ~2 minutos.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: JDK ${{ env.JAVA_VERSION }} + caché del repositorio Maven
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Caché de la base del NVD
        # Es LA optimización de este trabajo, no una más. Sin caché, cada
        # corrida vuelve a bajar y a indexar la base de vulnerabilidades
        # entera; con caché, sólo pide el delta desde la última actualización.
        #
        # La clave lleva la fecha del día: la caché se renueva una vez por
        # jornada (que es el ritmo al que el NVD publica) y 'restore-keys'
        # hace que mientras tanto se reutilice la de ayer como punto de
        # partida en vez de empezar de cero. Sin la fecha, la caché se
        # congelaría en el primer día y el escaneo miraría una base vieja
        # dando por buenas dependencias que ya tienen CVE publicada.
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - name: OWASP Dependency-Check
        env:
          # La clave entra por el entorno; el pom la lee con
          # ${env.NVD_API_KEY}. No se pasa con -D: un -D queda en el argv del
          # proceso y lo ve cualquier cosa que liste procesos en el runner.
          #
          # Es gratis y se pide en https://nvd.nist.gov/developers/request-an-api-key
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${NVD_API_KEY}" ]; then
            echo "::error::Falta el secreto NVD_API_KEY. Sin clave, el NVD limita el ritmo a un punto en que la descarga inicial tarda entre 30 y 60 minutos y falla seguido — este trabajo moriría por timeout sin decir nada útil. Pedila gratis en https://nvd.nist.gov/developers/request-an-api-key y cargala en Settings → Secrets and variables → Actions."
            exit 1
          fi

          # 'dependency-check:check' y no una fase del ciclo de vida: el plugin
          # resuelve el árbol de dependencias por su cuenta y no necesita que
          # el proyecto esté compilado. Compilar acá sería un minuto de más
          # para nada.
          #
          # El umbral (failBuildOnCVSS), los formatos, el archivo de
          # supresiones y los analizadores apagados están en el pom, no acá:
          # así './mvnw dependency-check:check' a mano da exactamente el mismo
          # resultado que el CI.
          ./mvnw ${MAVEN_ARGS} dependency-check:check

      - name: Resumen en el panel del workflow
        # 'always()': el informe hace falta sobre todo cuando el paso anterior
        # falló. Si sólo corriera en verde, el único caso en el que sirve sería
        # el único en el que no se genera.
        if: ${{ always() }}
        run: python3 scripts/ci-security-summary.py target/dependency-check/dependency-check-report.json

      - name: Subir el informe
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-report-${{ github.run_id }}
          # El HTML es el informe navegable, con el detalle por CVE y la
          # evidencia de por qué Dependency-Check identificó cada jar como lo
          # identificó — que es lo que hay que mirar para decidir si algo es
          # un falso positivo.
          path: target/dependency-check/
          retention-days: 30
          if-no-files-found: warn

  # ===========================================================================
  # 5. La imagen — se construye siempre, se publica sólo desde main
  # ===========================================================================
  # En un PR se construye y NO se publica. Eso es lo que hace que un Dockerfile
  # roto —una etiqueta base que ya no existe, un COPY a una ruta que se movió—
  # se descubra antes del merge y no en el primer push a main. Construir sin
  # publicar no necesita ninguna credencial, así que también funciona en un PR
  # de un fork.
  image:
    name: Imagen de contenedor
    needs: [unit, integration]
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      # El único permiso extra, y sólo lo usa el paso que publica. GitHub lo
      # degrada a lectura solo en los workflows disparados por un fork, que es
      # justamente donde no se publica.
      #
      # No hace falta ninguna credencial de registro: ghcr.io acepta el
      # GITHUB_TOKEN efímero de esta corrida. No hay un PAT que crear, que
      # rotar ni que revocar, y el token muere cuando termina el trabajo.
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Calcular etiquetas
        id: meta
        run: |
          set -euo pipefail
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-12)"

          # El nombre del repositorio de imágenes, en minúsculas: ghcr.io
          # rechaza mayúsculas y 'github.repository_owner' conserva las que
          # tenga la cuenta.
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          # La versión semántica sale del pom, que es donde ya vive.
          # find() sobre la raíz devuelve el hijo DIRECTO: el <version> del
          # proyecto, nunca el que está dentro de <parent> (el de Spring Boot,
          # catorce líneas más arriba, que es lo que agarraría un grep).
          # Se parsea con Python y no con 'mvnw help:evaluate' para que este
          # trabajo no necesite un JDK: no compila nada, sólo construye la
          # imagen.
          pom_version="$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text.strip())")"

          {
            echo "short_sha=${short_sha}"
            echo "pom_version=${pom_version}"
            echo "repo=${REGISTRY}/${owner}/${IMAGE_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Preparar buildx
        # El driver 'docker-container' (el que crea esta acción) es el único
        # que sabe exportar e importar caché de capas. Con el driver por
        # defecto, '--cache-to' no hace nada y el build es siempre en frío.
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Autenticarse en ghcr.io
        # Sólo cuando se va a publicar. En un PR este paso ni corre, así que un
        # PR de un fork nunca intenta autenticarse contra nada.
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # '--password-stdin' y no '-p': con '-p' el token queda en la línea de
          # comandos, visible en la lista de procesos del runner y en cualquier
          # traza de shell. Por stdin no toca ni el argv ni el historial.
          echo "${GH_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin

      - name: Construir${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && ' y publicar' || ' (sin publicar)' }}
        id: build
        env:
          REPO: ${{ steps.meta.outputs.repo }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          POM_VERSION: ${{ steps.meta.outputs.pom_version }}
          PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail

          # --- Esquema de etiquetado ------------------------------------------
          #   sha-<12>       identificable y única por commit. Es la que se usa
          #                  para saber qué commit produjo una imagen.
          #   <pom-version>  la versión semántica, leída del pom.
          #   main           puntero móvil, para que un humano pueda hacer
          #                  'docker pull ...:main' sin buscar el SHA.
          #
          # No se publica 'latest'. Una etiqueta móvil no responde la única
          # pregunta que importa durante un incidente: qué código está
          # corriendo. Y quien consuma esta imagen debería referenciarla por
          # DIGEST: una etiqueta es un puntero que se puede reapuntar, un
          # digest es el hash del contenido y no.
          #
          # --- org.opencontainers.image.source, y por qué se pisa --------------
          # El Dockerfile trae ese label con una URL vieja
          # (github.com/edteam/flight-reservations). En ghcr.io ese label no es
          # decorativo: es lo que ATA el paquete al repositorio, y de esa
          # atadura salen la visibilidad heredada y el permiso de escritura del
          # GITHUB_TOKEN. Con la URL equivocada el paquete queda huérfano.
          #
          # --- Por qué '--provenance=false' ------------------------------------
          # Con los attestations de buildx encendidos, lo que se sube no es un
          # manifiesto de imagen sino un ÍNDICE OCI que apunta al manifiesto de
          # la imagen MÁS al de la atestación, y el digest que devuelve el build
          # es el del índice. Apagarlo hace que el digest publicado sea el de la
          # imagen, que es el que alguien va a querer referenciar.
          #
          # --- Por qué la caché es 'type=gha' ----------------------------------
          # Son ~500 MB con 'mode=max' —incluye la etapa de compilación, que es
          # donde está el repositorio Maven de 400 MB y por lo tanto donde está
          # todo el ahorro— y en la caché de Actions son gratis: 10 GB por
          # repositorio. Es lo que lleva el build de ~2:50 en frío a ~40 s.
          args=(
            --file Dockerfile
            --tag "${REPO}:sha-${SHORT_SHA}"
            --tag "${REPO}:${POM_VERSION}"
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.version=${POM_VERSION}"
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --cache-from "type=gha,scope=flight-reservations"
            --cache-to   "type=gha,scope=flight-reservations,mode=max"
            --provenance=false
            --metadata-file /tmp/build-metadata.json
          )

          if [ "${PUBLISH}" = "true" ]; then
            args+=(--tag "${REPO}:main" --push)
          fi

          docker buildx build "${args[@]}" .

          if [ "${PUBLISH}" != "true" ]; then
            {
              echo "## 🔨 Imagen construida (no publicada)"
              echo ""
              echo "El Dockerfile construye. No se publica desde un pull request:"
              echo "la imagen se publica sólo en el push a \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # El digest sale del metadata del propio push, no de un 'docker
          # inspect' posterior ni de una consulta al registro: cualquiera de
          # esos dos volvería a resolver una ETIQUETA, y entre el push y la
          # consulta la etiqueta puede haber cambiado.
          digest="$(jq -r '."containerimage.digest"' /tmp/build-metadata.json)"
          [ -n "$digest" ] && [ "$digest" != "null" ] || { echo "::error::no se pudo leer el digest del push"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

          {
            echo "## 📦 Imagen publicada en GitHub Container Registry"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Repositorio | \`${REPO}\` |"
            echo "| Digest | \`${digest}\` |"
            echo "| Etiquetas | \`sha-${SHORT_SHA}\`, \`${POM_VERSION}\`, \`main\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo ""
            echo "Referencia inmutable (la que conviene usar, no la etiqueta):"
            echo ""
            echo '```bash'
            echo "docker pull ${REPO}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
