# Infraestructura de desarrollo. No hace falta instalar nada a mano:
#
#   cp .env.example .env        credenciales locales (el .env no se versiona)
#   docker compose up -d        levanta PostgreSQL, Redis, RabbitMQ y el catálogo
#   docker compose down         los detiene (conserva los datos)
#   docker compose down -v      los detiene y borra los datos
#
# El backend de observabilidad va aparte, detrás de un profile:
#
#   docker compose --profile observability up -d
#
# La aplicación se levanta aparte, con dos variables: una para que el scrape
# pueda leer /actuator/prometheus sin token y otra para exportar las trazas.
#
#   METRICS_SCRAPE_OPEN=true TRACING_EXPORT_ENABLED=true LOG_FORMAT=json \
#     ./mvnw spring-boot:run > docker/logs/app.log
#
#   Prometheus  http://127.0.0.1:9091   métricas y la pestaña Alerts
#   Grafana     http://127.0.0.1:3000   paneles. Se entra sin login como Viewer;
#                                       para editar, admin / reservations-local
#                                       (GRAFANA_USERNAME / GRAFANA_PASSWORD)
#   Loki        http://127.0.0.1:3100   índice de logs
#   Tempo       http://127.0.0.1:4318   OTLP/HTTP para las trazas
#
# Está detrás de un profile y no encendido por defecto por dos razones: los
# cuatro contenedores en reposo son ~600 MB de RAM, y el compose de todos los
# días tiene que seguir levantando lo que hace falta para CORRER la aplicación,
# no para observarla. La aplicación arranca y los tests pasan sin ninguno de
# estos cuatro, igual que arrancan sin Redis, sin broker y sin catálogo.
#
# Los cuatro son OSS y corren enteros en local: ninguno pide una cuenta ni un
# plan pago.
#
# Los valores por defecto coinciden con los de src/main/resources/application.yml,
# así que 'mvn spring-boot:run' conecta sin configurar nada más.
#
# Ninguna credencial está escrita acá. Lo que hay son referencias al entorno
# con un default de desarrollo (${VAR:-valor}), que es lo que permite rotarlas
# sin un commit y no dejarlas en el historial de git ni dentro de la imagen.
# El archivo .env está en .gitignore: es el único lugar donde viven los valores
# locales, y en cualquier otro entorno los pone el gestor de secretos.
services:
  postgres:
    image: postgres:17-alpine
    container_name: reservations-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-reservations}
      POSTGRES_USER: ${DB_USERNAME:-reservations}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reservations}
      # Falla rápido si alguien intenta conectarse sin contraseña.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Permite que otros servicios esperen a que la base acepte conexiones,
      # en lugar de fallar en el arranque.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-reservations} -d ${DB_NAME:-reservations}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Cache distribuido. La aplicación arranca igual sin él —cae al cache en
  # memoria del proceso— pero con Redis el cache es uno solo para todas las
  # instancias y sobrevive a los reinicios.
  redis:
    image: redis:7-alpine
    container_name: reservations-redis
    # Publicado sólo en la interfaz de loopback. Un Redis alcanzable desde la
    # red es un Redis que alguien envenena: quien escriba 'rsv:ver:{id}' fuerza
    # un 304 sobre datos viejos o un 409 evitable, y vaciando el cache del
    # catálogo arrastra al sistema al escenario de agotamiento del pool.
    #
    # En cualquier entorno real esto no se publica: Redis va en la red privada
    # y con TLS.
    ports:
      - "127.0.0.1:6379:6379"
    # Se replican acá las dos condiciones del free tier contra el que está
    # dimensionado el cache, para que el entorno local se parezca a producción
    # en lo único que importa: qué pasa cuando la memoria se llena.
    #
    #   maxmemory 30mb    el tope del plan gratuito típico
    #   allkeys-lru       al llenarse desaloja lo menos usado, en lugar de
    #                     empezar a rechazar escrituras (que es lo que hace
    #                     'noeviction', el default) y dejar el cache congelado
    #
    # Con los TTL y los tamaños estimados en el ADR 0001 —decenas de KB el
    # catálogo, cientos de KB los totales, ~90 B por reserva caliente— esto no
    # debería llegar a activarse; si se activa, la métrica de evictions lo
    # muestra antes de que se note como latencia.
    #
    # 'requirepass' además de la red: sin contraseña, cualquier proceso de la
    # misma máquina —un contenedor vecino, un script— tiene acceso total.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-reservations-local}
      - --maxmemory
      - 30mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-reservations-local}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    # Sin volumen a propósito: es un cache. Lo que haya adentro se puede perder
    # sin consecuencias, y persistirlo sólo agregaría I/O y un estado más que
    # limpiar entre corridas. Por eso también '--save ""', que apaga el RDB.

  # Broker de la mensajería. La aplicación arranca igual sin él —los eventos se
  # acumulan en la tabla outbox_message y el relay los publica cuando vuelve—
  # pero sin broker no salen a ningún lado.
  #
  # Consola de gestión: http://localhost:15672 (mismas credenciales). Es desde
  # donde se miran las colas, la profundidad de la DLQ y el contenido de un
  # mensaje muerto.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: reservations-rabbitmq
    hostname: reservations-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USERNAME:-reservations}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-reservations-local}
      # Las colas quorum necesitan un nombre de nodo estable: sin 'hostname'
      # fijo, cada recreación del contenedor genera uno nuevo y el volumen con
      # los mensajes durables queda huérfano.
      RABBITMQ_NODENAME: rabbit@reservations-rabbitmq
    # Publicado sólo en la interfaz de loopback, por el mismo motivo que Redis:
    # un broker alcanzable desde la red es un broker donde cualquiera publica
    # un 'reservation.cancelled' —o se suscribe a la cola de notificaciones y
    # lee la ruta y la fecha de viaje de cada pasajero—.
    #
    # En cualquier entorno real esto no se publica: el broker va en la red
    # privada, con TLS y con una credencial propia por servicio.
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    # Con volumen, al contrario que Redis: acá no hay nada descartable. Una
    # notificación pendiente que se pierde en el reinicio del broker es una
    # notificación que el usuario nunca recibe, y es exactamente lo que el
    # outbox está tratando de evitar.
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Catálogo de vuelos (servicio externo simulado) y su base MySQL.
  api-catalog:
    image: adschosen/api-catalog:1.1.0
    container_name: api-catalog
    ports:
      - "6070:6070"
    depends_on:
      - api-catalog-db
    restart: always

  # Base del catálogo. Es interna del servicio simulado: no hace falta que
  # nadie más la alcance, así que no publica puerto hacia la máquina. Antes
  # exponía 3310 con la contraseña de root escrita acá.
  api-catalog-db:
    image: mysql:8.0
    container_name: api-catalog-db
    environment:
      MYSQL_DATABASE: flights_catalog
      MYSQL_ROOT_PASSWORD: ${CATALOG_DB_ROOT_PASSWORD:-muppet}
    expose:
      - "3306"
    restart: always

  # ------------------------------------------------------------------
  # Backend de observabilidad. Profile 'observability'.
  # ------------------------------------------------------------------

  # Raspa /actuator/prometheus cada 15 s y evalúa las reglas de
  # docker/prometheus/rules/reservations.yml.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: reservations-prometheus
    profiles: ["observability"]
    # 9091 hacia afuera: el 9090 de la máquina es el puerto de GESTIÓN de la
    # aplicación, y pisarlo haría que Prometheus se raspe a sí mismo.
    #
    # Sólo en loopback, igual que Redis y que RabbitMQ y por el mismo motivo:
    # un Prometheus alcanzable desde la red publica la volumetría de negocio
    # —cuántas reservas por minuto, cuántas fallan— sin pedir nada.
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    # La aplicación corre FUERA de Docker ('mvn spring-boot:run'), así que
    # desde adentro del contenedor 'localhost' es el contenedor. Esto es lo que
    # hace que el target funcione en Linux y no sólo en Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 7 días: es un entorno local y lo que se mira es la última hora.
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    restart: unless-stopped

  # Los paneles. Datasources provisionados por archivo: un Grafana que hay que
  # configurar a mano después de cada 'down -v' no lo usa nadie.
  grafana:
    image: grafana/grafana-oss:11.5.1
    container_name: reservations-grafana
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Usuario administrador. La credencial viene del entorno, como todas las
      # demás de este archivo, con un default de desarrollo: rotarla no pide un
      # commit y el valor no queda en el historial de git.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USERNAME:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-reservations-local}
      # Anónimo como Viewer ADEMÁS del login, no en lugar de él.
      #
      # Antes estaba con 'GF_AUTH_DISABLE_LOGIN_FORM: true', que saca el
      # formulario entero: se entraba a mirar y no había forma de iniciar
      # sesión para explorar, cambiar el rango o guardar una copia de un panel.
      # Era el peor de los dos mundos — ni cerrado ni usable —.
      #
      # Se conserva el anónimo porque es lo que hace que 'up -d' y abrir el
      # navegador muestre algo sin buscar una contraseña, y es defendible SÓLO
      # porque el puerto está en loopback: un Grafana sin contraseña alcanzable
      # desde la red es una consola con acceso de lectura a todo. En cualquier
      # entorno real esto va detrás del SSO de la organización y el anónimo se
      # apaga con GRAFANA_ANONYMOUS=false.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      # Sin esto, cada pestaña nueva arranca en la lista de dashboards vacía.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/10-camino-del-pedido.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      # Los paneles, versionados. De sólo lectura a propósito: un dashboard
      # provisionado se cambia editando su JSON y no desde la UI, que es lo que
      # permite revisar el cambio en un diff.
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # SIN volumen para la base de Grafana, y es una decisión, no un olvido.
      #
      # `GF_SECURITY_ADMIN_PASSWORD` sólo se aplica cuando Grafana INICIALIZA su
      # grafana.db. Con un volumen persistente, el usuario admin queda creado en
      # el primer arranque con la contraseña de ese momento y cambiar la
      # variable después no hace absolutamente nada: la credencial nueva es
      # inerte y el login falla sin ningún mensaje que explique por qué. Es una
      # trampa silenciosa, y la pagamos acá antes de que la pague otro.
      #
      # El volumen tampoco compraba casi nada: los datasources y los tres
      # dashboards se provisionan desde archivos, así que lo único que se
      # perdía eran las preferencias de UI y las copias hechas con «Save as»
      # —que son justamente el artefacto que envejece mal y que nadie revisa en
      # un diff—. El histórico de métricas vive en el volumen de Prometheus y
      # el de logs en el de Loki: ninguno de los dos se toca.
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  # Índice de logs. Con el JSON del esquema, 'event' y 'level' son etiquetas de
  # consulta y 'correlationId' es un campo del registro —no una etiqueta, que
  # sería una serie por pedido—.
  loki:
    image: grafana/loki:3.3.2
    container_name: reservations-loki
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # El que lee el archivo de log y lo empuja a Loki.
  #
  # Va acá y NO como un appender de red adentro de la aplicación: un appender
  # que manda logs por TCP agrega un modo de falla nuevo —qué pasa cuando el
  # backend de logs no responde— dentro del proceso que se está tratando de
  # observar. La aplicación escribe JSON a stdout y punto.
  #
  #   LOG_FORMAT=json ./mvnw spring-boot:run > docker/logs/app.log
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: reservations-alloy
    profiles: ["observability"]
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # El directorio vive en el repositorio (con su .gitignore) y no en /tmp:
      # un bind mount de una ruta que no existe falla el arranque del contenedor
      # en Docker Desktop, y «arreglalo creando un directorio» es el tipo de
      # paso que hace que nadie levante el stack una segunda vez.
      - ${RESERVATIONS_LOG_DIR:-./docker/logs}:/var/log/reservations:ro
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    restart: unless-stopped

  # Trazas. La aplicación exporta sólo con TRACING_EXPORT_ENABLED=true, que es
  # lo que permite que el proceso arranque sin este contenedor.
  tempo:
    image: grafana/tempo:2.7.0
    container_name: reservations-tempo
    profiles: ["observability"]
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:3200:3200"
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    command: -config.file=/etc/tempo.yaml
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  # Los cuatro del profile 'observability'. Con volumen y no sin él porque
  # perder el histórico de métricas en cada reinicio hace inútil mirar una
  # ventana de más de cinco minutos, que es cuando esto empieza a servir.
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
