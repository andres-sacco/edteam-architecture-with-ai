# Base de datos para desarrollo. No hace falta instalar PostgreSQL:
#
#   docker compose up -d        levanta la base
#   docker compose down         la detiene (conserva los datos)
#   docker compose down -v      la detiene y borra los datos
#
# Los valores coinciden con los de src/main/resources/application.yml, así que
# 'mvn spring-boot:run' conecta sin configurar nada más.
services:
  postgres:
    image: postgres:17-alpine
    container_name: reservations-postgres
    environment:
      POSTGRES_DB: reservations
      POSTGRES_USER: reservations
      POSTGRES_PASSWORD: reservations
      # Falla rápido si alguien intenta conectarse sin contraseña.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Permite que otros servicios esperen a que la base acepte conexiones,
      # en lugar de fallar en el arranque.
      test: ["CMD-SHELL", "pg_isready -U reservations -d reservations"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
